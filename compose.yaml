services:

  ganxterm:
    build:
      context: .
      dockerfile: Containerfile
    restart: unless-stopped
    ports:
      - "8765:8765"
    env_file:
      - .env
    environment:
      - GANXTERM_DATA_DIR=/data
      - GANXTERM_DOWNLOAD_DIR=/downloads
    volumes:
      - ganxterm_data:/data
      - ${GANXTERM_DOWNLOAD_HOST_DIR:-${HOME}/Downloads}:/downloads

volumes:
  ganxterm_data:
